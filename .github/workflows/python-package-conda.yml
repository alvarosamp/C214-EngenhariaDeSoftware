name: Python package CI 

on: [push]

jobs:
  tests:
    name: Run tests and upload report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r c214_projeto/requirements.txt
      - name: Run tests (pytest)
        env:
          PYTHONPATH: ./src
        run: |
          pytest -q --junitxml=report.xml
      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.xml

  build:
    name: Build package and upload artifact
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip
          pip install build
          cd c214_projeto
          python -m build --sdist --wheel
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: c214_projeto/dist/*

  notify:
    name: Send notification (email) using script
    runs-on: ubuntu-latest
    needs: [tests, build]
    steps:
      - uses: actions/checkout@v4
      - name: Run notification script
        env:
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TEST_STATUS: ${{ needs.tests.result }}
          BUILD_STATUS: ${{ needs.build.result }}
        run: |
          python ./scripts/notify.py
