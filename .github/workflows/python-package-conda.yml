name: Python package CI 

on: [push]

# Prevent duplicate workflow runs for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Run tests and upload report
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: [3.10, 3.9]  # Rodar testes com Python 3.10 e 3.9 em paralelo
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r c214_projeto/requirements.txt
      - name: Run tests (pytest)
        env:
          PYTHONPATH: c214_projeto/src
        run: |
          pytest -q --junitxml=report-${{ matrix.python-version }}.xml
      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.python-version }}
          path: report-${{ matrix.python-version }}.xml

  build:
    name: Build package and upload artifact
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip
          pip install build
          cd c214_projeto
          python -m build --sdist --wheel
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: c214_projeto/dist/*

  lint:
    name: Lint (runs in parallel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Run flake8
        run: |
          flake8 . --max-line-length=127 --exit-zero

  notify:
    name: Send notification (email) using script
    runs-on: ubuntu-latest
    needs: [tests, build]
    steps:
      - uses: actions/checkout@v4
      - name: Download test report artifact
        uses: actions/download-artifact@v4
        with:
          name: test-report-3.10
          path: . # Baixando o report do Python 3.10
      - name: Run notification script
        env:
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TEST_STATUS: ${{ needs.tests.result }}
          BUILD_STATUS: ${{ needs.build.result }}
        run: |
          chmod +x ./scripts/send_email_ubuntu.sh
          ./scripts/send_email_ubuntu.sh > send.log 2>&1 || true
          if grep -q "swaks finished" send.log; then
            echo "send_email_ubuntu.sh reported success (or accepted by SMTP)."
          else
            echo "swaks send likely failed or not confirmed; running python fallback notify.py"
            python ./scripts/notify.py > fallback.log 2>&1 || true
          fi
      - name: Upload notify logs
        uses: actions/upload-artifact@v4
        with:
          name: notify-logs
          path: |
            send.log
            fallback.log
