name: Python package CI

on: [push]

# Impede a execução de workflows duplicados para a mesma referência
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Run tests and upload report
    runs-on: ubuntu-latest
    # A seção 'strategy: matrix:' foi removida daqui para simplificar o job
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          # A versão do Python agora está definida diretamente
          python-version: '3.9'
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r c214_projeto/requirements.txt
      - name: Run tests (pytest)
        env:
          PYTHONPATH: c214_projeto/src
        run: |
          # O nome do arquivo de relatório agora é fixo
          pytest -q --junitxml=report-3.9.xml
      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          # O nome do artefato agora é fixo
          name: test-report-3.9
          path: report-3.9.xml

  build:
    name: Build package and upload artifact
    runs-on: ubuntu-latest
    # Este job já estava correto e roda em paralelo com 'tests'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip
          pip install build
          cd c214_projeto
          python -m build --sdist --wheel
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: c214_projeto/dist/*

  notify:
    name: Send notification (email) using script
    runs-on: ubuntu-latest
    # Este job só vai rodar depois que tanto os jobs de testes quanto de build forem concluídos
    needs: [tests, build]
    if: always() # Vai rodar sempre, mesmo que algum job anterior tenha falhado
    steps:
      - uses: actions/checkout@v4
      - name: Download test report artifact
        uses: actions/download-artifact@v4
        with:
          name: test-report-3.9
          path: . # Baixando o report do Python 3.9
      - name: Run notification script
        env:
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TEST_STATUS: ${{ needs.tests.result }}
          BUILD_STATUS: ${{ needs.build.result }}
        run: |
          chmod +x ./scripts/send_email_ubuntu.sh
          ./scripts/send_email_ubuntu.sh > send.log 2>&1 || true
          if grep -q "swaks finished" send.log; then
            echo "send_email_ubuntu.sh reported success (or accepted by SMTP)."
          else
            echo "swaks send likely failed or not confirmed; running python fallback notify.py"
            python ./scripts/notify.py > fallback.log 2>&1 || true
          fi
      - name: Upload notify logs
        uses: actions/upload-artifact@v4
        with:
          name: notify-logs
          path: |
            send.log
            fallback.log
